version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: trustgov-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-trustgov_production}
      POSTGRES_USER: ${DB_USER:-trustgov_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trustgov_secure_db_pass_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trustgov_user} -d ${DB_NAME:-trustgov_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustgov-network

  # TrustGov API Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustgov-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-trustgov_user}:${DB_PASSWORD:-trustgov_secure_db_pass_2026}@postgres:5432/${DB_NAME:-trustgov_production}
      JWT_SECRET: ${JWT_SECRET:-production-sample-secure-jwt-secret-at-least-32-chars}
      JWT_ISSUER: trustgov-auth-service
      JWT_AUDIENCE: trustgov-api
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "5000:5000"
    volumes:
      - evidence-storage:/app/storage/evidence
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - trustgov-network

volumes:
  pgdata:
  evidence-storage:

networks:
  trustgov-network:
    driver: bridge
